# =============================================================================
# ANALYTICS
# =============================================================================
analytics:
  return_windows:
    "1D": 1
    "1W": 5
    "1M": 21
    "3M": 63
    "1Y": 252
  realised_vol_window: 20        # trading days
  annualisation_factor: 252
  zscore_lookback: 252           # trailing 1y distribution for 1D return z-scores
  correlation_window: 60
  percentile_lookback: 252
  moving_averages: [50, 200]
  min_observations: 30           # below this, a metric renders as "n/a"

# --- "What stood out" flag thresholds ---------------------------------------
flags:
  return_zscore: 2.0             # |1D return z| above this
  high_low_window: 252           # 52-week high/low lookback
  ma_cross_tolerance_pct: 0.15   # how close counts as "at" the MA
  vix_backwardation_ratio: 1.0   # VIX/VIX3M above this = backwardation
  credit_spread_move_bp: 10      # 1D OAS move flagged above this
  curve_inversion_tolerance_bp: 2
  max_flags: 12

# --- Curve move classification ----------------------------------------------
curve:
  classification_threshold_bp: 2  # moves smaller than this are "little changed"
  short_tenor: "DGS2"
  long_tenor: "DGS10"
  comparison_windows: ["1D", "1W"]
  history_windows_ago: ["1W", "1M", "1Y"]

# --- Risk regime composite --------------------------------------------------
# Descriptive indicator only — NOT a trading signal. Each component is
# z-scored over `lookback` days, multiplied by `sign` (+1 = higher value means
# more risk-off) and weighted. Missing components are dropped and the
# remaining weights re-normalised.
regime:
  lookback: 504                  # ~2 years
  label: "Risk regime composite"
  components:
    vix_level:        { weight: 0.20, sign:  1, source: "^VIX",          label: "VIX level" }
    vix_term:         { weight: 0.15, sign:  1, source: "vix_ratio",     label: "VIX term structure" }
    hy_spread:        { weight: 0.20, sign:  1, source: "BAMLH0A0HYM2",  label: "HY credit spread" }
    spx_vs_200dma:    { weight: 0.15, sign: -1, source: "^GSPC",         label: "SPX vs 200dma" }
    stock_bond_corr:  { weight: 0.10, sign:  1, source: "spy_tlt_corr",  label: "Stock-bond correlation" }
    dxy_momentum:     { weight: 0.10, sign:  1, source: "DX-Y.NYB",      label: "USD 1m momentum" }
    nfci:             { weight: 0.10, sign:  1, source: "NFCI",          label: "Financial conditions" }
  bands:
    - { max: -1.0, label: "Risk-on",        tone: "positive" }
    - { max: -0.3, label: "Mildly risk-on", tone: "positive" }
    - { max:  0.3, label: "Neutral",        tone: "neutral" }
    - { max:  1.0, label: "Mildly risk-off", tone: "negative" }
    - { max:  99.0, label: "Risk-off",      tone: "negative" }

# --- Cross-asset correlation matrix -----------------------------------------
cross_asset:
  members:
    - { key: "^GSPC",        label: "SPX" }
    - { key: "^NDX",         label: "NDX" }
    - { key: "^RUT",         label: "RUT" }
    - { key: "TLT",          label: "TLT" }
    - { key: "DX-Y.NYB",     label: "DXY" }
    - { key: "GC=F",         label: "Gold" }
    - { key: "CL=F",         label: "WTI" }
    - { key: "BTC-USD",      label: "BTC" }
    - { key: "BAMLH0A0HYM2", label: "HY OAS Δ", is_spread: true }

# =============================================================================
# DATA QUALITY
# =============================================================================
quality:
  # Staleness fallback. Where a next-release date is known (macro series), a
  # series is stale only once that scheduled release has passed without new
  # data — an exact test. These grace periods are the fallback for series with
  # no known release date, and must account for FRED dating an observation at
  # the START of its period: August CPI is dated 2026-08-01 but published in
  # mid-September, so a perfectly current monthly series can be ~75 days old.
  staleness_grace_days:
    daily: 5
    weekly: 14
    monthly: 95
    quarterly: 200

  # A price series whose most recent bar is older than this is not merely
  # stale, it is misleading: it would be presented as the current level. Such
  # tickers are dropped so the affected section degrades honestly. Yahoo does
  # this periodically to thinly-followed symbols such as ^VIX3M.
  max_price_age_days: 7
  max_plausible_daily_move_pct:
    default: 25.0
    crypto: 40.0
    volatility: 80.0
  reject_non_positive_prices: true

# =============================================================================
# PRESENTATION
# =============================================================================
display:
  kpi_strip: ["^GSPC", "^NDX", "DGS10", "T10Y2Y", "^VIX", "DX-Y.NYB", "CL=F", "GC=F", "BTC-USD"]
  decimals:
    price: 2
    percent: 2
    basis_points: 0
    yield: 2
  heatmap_windows: ["1D", "1W", "1M", "YTD"]
  small_multiples_years: 5
  disclaimer: >-
    This tear-sheet is produced automatically for education and information
    only. It is not investment advice, nor a recommendation to buy or sell any
    security. Data may be delayed, incomplete or incorrect.

email:
  from_address: "onboarding@resend.dev"   # Resend free plan sender
  subject_template: "{date} · SPX {spx} · 10Y {ten_year} · VIX {vix} · DXY {dxy}"
  include_sections: ["kpi", "flags", "calendar"]
